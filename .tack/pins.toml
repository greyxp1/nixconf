# edit by hand or with tack add / rm / alias

[shorturls]
gh = "github:{path}"

[all_follow]
nixpkgs = ["nixpkgs-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file

[inputs.nixpkgs]
url = "gh:nixos/nixpkgs/nixos-unstable"
[inputs.preservation]
url = "gh:nix-community/preservation"
[inputs.import-tree]
url = "gh:vic/import-tree"
[inputs.musnix]
url = "gh:musnix/musnix"
[inputs.waytator]
url = "gh:linusammon/waytator/flake"
[inputs.nix-yazi-plugins]
url = "gh:greyxp1/nix-yazi-plugins"
[inputs.disko]
url = "gh:nix-community/disko"
[inputs.home-manager]
url = "gh:nix-community/home-manager"
[inputs.nsticky]
url = "gh:lonerOrz/nsticky"
[inputs.helium]
url = "gh:greyxp1/helium-flake"
[inputs.nixcord]
url = "gh:4evy/nixcord"
[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"

[inputs.oniri]
url = "gh:Antiz96/oniri"
type = "fetch"

[inputs.flake-parts]
url = "gh:hercules-ci/flake-parts"
follows = { nixpkgs-lib = "nixpkgs" }

[inputs.chaotic]
url = "gh:chaotic-cx/nyx/nyxpkgs-unstable"
exclude_follow = ["nixpkgs"]

[inputs.niri-nix]
url = "git+https://codeberg.org/BANanaD3V/niri-nix"
exclude_follow = ["nixpkgs"]

[inputs.noctalia]
url = "gh:noctalia-dev/noctalia/cachix"
exclude_follow = ["nixpkgs"]

[inputs.catppuccin]
url = "gh:catppuccin/nix"
exclude_follow = ["nixpkgs"]

[inputs.niri-autoselect-portal]
url = "git+https://codeberg.org/debugloop/niri-autoselect-portal.git"

[inputs.smartcut]
url = "gh:skeskinen/smartcut"
type = "fetch"
