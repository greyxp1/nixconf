# edit by hand or with tack add / rm / alias

[shorturls]
gh = "github:{path}"

[all_follow]
nixpkgs = ["nixpkgs-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file

[inputs.flake-parts]
url = "gh:hercules-ci/flake-parts"
follows = { nixpkgs-lib = "nixpkgs" }
[inputs.nixpkgs]
url = "gh:nixos/nixpkgs/nixos-unstable"
[inputs.sunshine-nixpkgs]
url = "gh:nixos/nixpkgs/fd29d673b014a4f88f9bb9ec628b46055243cf96"
[inputs.libvirtualhid]
url = "gh:LizardByte/libvirtualhid/master"
type = "fetch"
[inputs.moonlight-embedded]
url = "git+https://github.com/moonlight-stream/moonlight-embedded?ref=refs/pull/940/head"
type = "fetch"
submodules = true
[inputs.preservation]
url = "gh:nix-community/preservation"
[inputs.import-tree]
url = "gh:vic/import-tree"
[inputs.disko]
url = "gh:nix-community/disko"
[inputs.wrappers]
url = "git+https://github.com/nix-community/nix-wrapper-modules?rev=1db3c116a6aa61823f8d8f3c47c306846428fc54"
[inputs.system-manager]
url = "gh:numtide/system-manager"
[inputs.helium]
url = "gh:greyxp1/helium-flake"
[inputs.nixcord]
url = "gh:4evy/nixcord"
[inputs.mpv-smartcut]
url = "gh:greyxp1/mpv-smartcut"
[inputs.mpv-auto-sub-sync]
url = "gh:greyxp1/mpv-auto-sub-sync"
[inputs.ncr]
url = "gh:greyxp1/ncr"
[inputs.niri]
url = "gh:greyxp1/niri/personal"
[inputs.niri-screenshare]
url = "gh:pantarune/niri-screenshare/pull/15/head"
[inputs.perch]
url = "gh:greyxp1/perch"
[inputs.computer-use-linux]
url = "gh:greyxp1/computer-use-linux-flake"
[inputs.cord-stash]
url = "gh:greyxp1/cord-stash"
type = "fetch"
[inputs.kovaaks-config]
url = "gh:greyxp1/kovaaks-config"
type = "fetch"
[inputs.nix-flatpak]
url = "gh:gmodena/nix-flatpak"
[inputs.inshellah]
url = "gh:manic-systems/inshellah"
[inputs.compress-yazi]
url = "gh:KKV9/compress.yazi/pull/32/head"
type = "fetch"
[inputs.monstar]
url = "gh:rockorager/monstar/pull/67/head"

# Preserve upstream Nixpkgs
[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"
exclude_follow = ["nixpkgs"]
[inputs.catppuccin]
url = "gh:catppuccin/nix"
exclude_follow = ["nixpkgs"]
[inputs.vellum]
url = "gh:greyxp1/vellum"
exclude_follow = ["nixpkgs"]
[inputs.llm-agents]
url = "gh:numtide/llm-agents.nix"
exclude_follow = ["nixpkgs"]

