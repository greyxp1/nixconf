[shorturls]
gh = "github:{path}"
[all_follow]
nixpkgs = "nixpkgs"
systems = "default"
flake-parts = "flake-parts"
[inputs.nixpkgs]
url = "gh:nixos/nixpkgs/nixos-unstable"
[inputs.sunshine]
url = "git+https://github.com/LizardByte/Sunshine?rev=774be88e41b5ddfe6cea5baab4ad658e3cb4adde"
type = "fetch"
submodules = true
[inputs.moonlight-embedded]
url = "git+https://github.com/moonlight-stream/moonlight-embedded?ref=refs/pull/940/head"
type = "fetch"
submodules = true
[inputs.preservation]
url = "gh:nix-community/preservation"
[inputs.disko]
url = "gh:nix-community/disko"
# Drop with alma: only alma and install-alma.sh use System Manager.
[inputs.system-manager]
url = "gh:numtide/system-manager"
[inputs.helium]
url = "gh:greyxp1/helium-flake"
[inputs.nixcord]
url = "gh:4evy/nixcord"
[inputs.mpv-splice]
url = "gh:greyxp1/mpv-splice"
[inputs.mpv-auto-sub-sync]
url = "gh:greyxp1/mpv-auto-sub-sync"
[inputs.ncr]
url = "gh:greyxp1/ncr"
[inputs.iets]
url = "gh:numtide/iets"
exclude_follow = ["nixpkgs"]
[inputs.niri]
url = "gh:greyxp1/niri/personal"
exclude_follow = ["nixpkgs"]
[inputs.niri-screenshare]
url = "gh:pantarune/niri-screenshare"
[inputs.perch]
url = "gh:greyxp1/perch"
[inputs.vellum]
url = "gh:greyxp1/vellum/master"
exclude_follow = ["nixpkgs"]
[inputs.cord-stash]
url = "gh:greyxp1/cord-stash"
type = "fetch"
[inputs.relay]
url = "gh:greyxp1/Relay"
exclude_follow = ["nixpkgs"]
[inputs.nix-flatpak]
url = "gh:gmodena/nix-flatpak"
[inputs.neo-ls]
url = "gh:nolight132/nls"
[inputs.compress-yazi]
url = "gh:greyxp1/compress.yazi"
type = "fetch"
[inputs.monstar]
url = "gh:rockorager/monstar"
[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"
[inputs.catppuccin]
url = "gh:catppuccin/nix"
[inputs.hydro]
url = "gh:greyxp1/hydro"
type = "fetch"
[inputs.cliproxyapi]
url = "gh:greyxp1/CLIProxyAPI"
[inputs.rustbg]
url = "gh:greyxp1/rustbg"
[inputs.nix-secrets]
url = "gh:unnamed-systems/nix-secrets"
[inputs.tack]
url = "gh:manic-systems/tack"
# Uses its own nixpkgs to match the builds on cache.manic.systems.
exclude_follow = ["nixpkgs"]
[inputs.t3code]
url = "gh:greyxp1/t3code-flake"
# Uses its own nixpkgs to match the packages built by CI.
exclude_follow = ["nixpkgs"]

[inputs.browse]
url = "gh:greyxp1/browse-flake"

[inputs.lintel]
url = "gh:greyxp1/lintel"
type = "fetch"

