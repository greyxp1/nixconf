"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 1500

format = """
[](fg:color_bg1)\
$os\
$username\
$hostname\
[ ](fg:color_bg1 bg:color_bg2)\
$directory\
[ ](fg:color_bg2 bg:color_bg3)\
$git_branch\
$git_status\
[ ](fg:color_bg3 bg:color_bg4)\
$cmd_duration\
[ ](fg:color_bg4)\
$character\
"""

palette = "ccswe_dark"
[palettes.ccswe_dark]
color_bg1 = "#2f5783"
color_bg2 = "#294262"
color_bg3 = "#232f44"
color_bg4 = "#1d2230"
color_blue = "#769ff0"
color_gray = "#999999"
color_red = "#eb4d28"
color_white = "#f2f2f2"

[os]
style = "bg:color_bg1 fg:color_white"
format = "[$symbol]($style)"
disabled = false

[os.symbols]
NixOS = " "

[username]
style_user = "bg:color_bg1 fg:color_white"
style_root = "bg:color_bg1 fg:color_red"
format = "[$user]($style)"
show_always = false
disabled = false

[hostname]
style = "bg:color_bg1 fg:color_white"
format = "[@$hostname]($style)"
ssh_only = true
ssh_symbol = " "

[directory]
style = "bg:color_bg2 fg:color_white"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "../"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
style = "bg:color_bg3 fg:color_blue"
format = "[$symbol $branch]($style)"
symbol = ""

[git_status]
style = "bold bg:color_bg3 fg:color_red"
format = '[( $all_status$ahead_behind)]($style)'
ahead = "⇡${count}"
behind  = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
deleted  = ""

[cmd_duration]
style = "bg:color_bg4 fg:color_gray"
format = "[$duration]($style)"
min_time = 500

[character]
success_symbol = "[❯](bold color_blue)"
error_symbol = "[❯](bold color_red)"
