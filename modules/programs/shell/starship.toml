"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 1500

# Format
format = """
[](fg:color_bg2)\
$os\
$username\
$hostname\
[ ](fg:color_bg2 bg:color_bg3)\
$directory\
[ ](fg:color_bg3 bg:color_bg4)\
$cmd_duration\
[](fg:color_bg4)\
$character\
"""

right_format = """
[](fg:color_bg3)\
$bun\
$c\
$cpp\
$crystal\
$dart\
$docker_context\
$dotnet\
$elixir\
$golang\
$gradle\
$haskell\
$java\
$kotlin\
$lua\
$custom\
$nodejs\
$php\
$python\
$ruby\
$rust\
$swift\
$zig\
[ ](fg:color_bg3 bg:color_bg4)\
$git_branch\
$git_status\
[ ](fg:color_bg4 bg:color_bg5)\
$time\
[](fg:color_bg5)\
"""

# Palette
palette = "ccswe_dark"
[palettes.ccswe_dark]
color_bg1 = "#336699"
color_bg2 = "#2f5783"
color_bg3 = "#294262"
color_bg4 = "#232f44"
color_bg5 = "#1d2230"
color_blue = "#769ff0"
color_gray = "#999999"
color_red = "#eb4d28"
color_white = "#f2f2f2"

# Left prompt
[os]
style = "bg:color_bg2 fg:color_white"
format = "[$symbol]($style)"
disabled = false

[os.symbols]
NixOS = " "

[cmd_duration]
style = "bg:color_bg4 fg:color_gray"
format = "[$duration]($style)"
min_time = 500

[directory]
style = "bg:color_bg3 fg:color_white"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "../"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[hostname]
style = "bg:color_bg2 fg:color_white"
format = "[@$hostname]($style)"
ssh_only = true
ssh_symbol = " "

[username]
style_user = "bg:color_bg2 fg:color_white"
style_root = "bg:color_bg2 fg:color_red"
format = "[$user]($style)"
show_always = false
disabled = false

[character]
success_symbol = "[❯](bold color_blue)"
error_symbol = "[❯](bold color_red)"

# Right prompt
[bun]
style = "bg:color_bg3 fg:#fbf0df"
format = '[$symbol($version)]($style)'
symbol = " "

[c]
style = "bg:color_bg3 fg:#6295CB"
format = '[$symbol]($style)'
symbol = " "

[cpp]
style = "bg:color_bg3 fg:#084a86"
format = '[$symbol]($style)'
symbol = " "

[crystal]
style = "bg:color_bg3 fg:#000000"
format = '[$symbol($version)]($style)'
symbol = " "

[dart]
style = "bg:color_bg3 fg:#2bb7f6"
format = '[$symbol($version)]($style)'
symbol = " "

[docker_context]
style = "bg:color_bg3 fg:#1d63ed"
format = '[$symbol($context)]($style)'
symbol = " "

[dotnet]
style = "bg:color_bg3 fg:#1180C3"
format = '[$symbol]($style)'
symbol = " "

[elixir]
style = "bg:color_bg3 fg:#420e5d"
format = '[$symbol($version)]($style)'
symbol = " "

[golang]
style = "bg:color_bg3 fg:#00acd7"
format = '[$symbol($version)]($style)'
symbol = " "

[gradle]
style = "bg:color_bg3 fg:#02303a"
format = '[$symbol($version)]($style)'
symbol = " "

[haskell]
style = "bg:color_bg3 fg:#433762"
format = '[$symbol($version)]($style)'
symbol = " "

[java]
style = "bg:color_bg3 fg:#F7901E"
format = '[$symbol]($style)'
symbol = " "

[kotlin]
style = "bg:color_bg3 fg:#C017E4"
format = '[$symbol]($style)'
symbol = " "

[lua]
style = "bg:color_bg3 fg:#000081"
format = '[$symbol($version)]($style)'
symbol = " "

[custom.nix]
style = "bg:color_bg3 fg:#7EBAE4"
format = '[$symbol]($style)'
symbol = " "
when = "find . -maxdepth 1 -name '*.nix' | grep -qm1 ."

[nodejs]
style = "bg:color_bg3 fg:#5FA04E"
format = '[$symbol($version)]($style)'
symbol = " "

[php]
style = "bg:color_bg3 fg:#4f5b93"
format = '[$symbol($version)]($style)'
symbol = " "

[python]
style = "bg:color_bg3 fg:#4081b3"
format = '[$symbol($version)]($style)'
symbol = " "

[ruby]
style = "bg:color_bg3 fg:#ad0c00"
format = '[$symbol($version)]($style)'
symbol = " "

[rust]
style = "bg:color_bg3 fg:#C73500"
format = '[$symbol($version)]($style)'
symbol = " "

[swift]
style = "bg:color_bg3 fg:#fe5534"
format = '[$symbol($version)]($style)'
symbol = " "

[zig]
style = "bg:color_bg3 fg:#f7a41d"
format = '[$symbol($version)]($style)'
symbol = " "

[git_branch]
style = "bg:color_bg4 fg:color_blue"
format = "[$symbol $branch]($style)"
symbol = ""

[git_status]
style = "bold bg:color_bg4 fg:color_red"
format = '[( $all_status$ahead_behind)]($style)'
ahead = "⇡${count}"
behind  = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
deleted  = ""

[time]
disabled = false
style = "bg:color_bg5 fg:#A6AEBF"
format = "[$time]($style)"
time_format = "%R"
